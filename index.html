<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ILTVIBE — I LIKE THE VIBE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* WIDE HEADER / BANNER */

    header {
      width: 100%;
      overflow: hidden;
      margin-bottom: 35px;
    }

    .banner-wide {
      width: 100%;
      height: auto;
      display: block;
    }

    /* MAIN */

    main {
      width: min(900px, 92%);
      margin: auto;
    }

    .section-title {
      font-size: 12px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    /* RANDOM VIDEO */

    .random-section {
      margin-bottom: 55px;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid #222;
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .random-button {
      display: block;
      margin: 18px auto 0;
      padding: 13px 25px;
      border: 1px solid #333;
      border-radius: 30px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 1px;
      transition: 0.25s;
    }

    .random-button:hover {
      background: white;
      color: black;
      border-color: white;
    }

    /* ARTIST PROFILE SECTION */

    .artist-section {
      margin-bottom: 55px;
      text-align: center;
    }

    .artist-box {
      width: 100%;
      max-width: 450px;
      margin: auto;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid #222;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .artist-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .artist-title {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
      letter-spacing: 2px;
    }

    /* ALBUMS */

    .albums {
      margin-bottom: 70px;
    }

    .album-list {
      display: grid;
      gap: 10px;
    }

    .album {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px;
      background: #0e0e0e;
      border: 1px solid #1d1d1d;
      border-radius: 12px;
      transition: 0.25s;
    }

    .album:hover {
      background: #151515;
      transform: translateX(5px);
      border-color: #444;
    }

    .album-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .arrow {
      color: #777;
      font-size: 20px;
    }

    /* CONNECT */

    .connect {
      text-align: center;
      padding: 35px 0 50px;
      border-top: 1px solid #181818;
    }

    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .socials a {
      padding: 10px 16px;
      border: 1px solid #242424;
      border-radius: 30px;
      color: #aaa;
      font-size: 13px;
      transition: 0.25s;
    }

    .socials a:hover {
      color: white;
      border-color: #555;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 0 20px 30px;
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      header {
        margin-bottom: 20px;
      }

      .album {
        padding: 19px;
      }

      .album-name {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- FULL WIDE LOGO BANNER -->

  <header>
    <img class="banner-wide" src="banner.png" alt="ILTVIBE Official Wide Banner">
  </header>


  <main>

    <!-- RANDOM YOUTUBE VIDEO -->

    <section class="random-section">

      <div class="section-title">Random Vibe</div>

      <div class="video-box">
        <iframe
          id="youtubePlayer"
          src=""
          title="ILTVIBE Random Vibe"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <button class="random-button" onclick="randomVideo()">
        ⟳ RANDOM VIBE
      </button>

    </section>


    <!-- ARTIST PROFILE IMAGE -->

    <section class="artist-section">
      <div class="section-title">The Artist</div>
      <div class="artist-box">
        <img src="artist.png" alt="ILTVIBE Artist Profile">
      </div>
      <div class="artist-title">ILTVIBE MUSIC</div>
    </section>


    <!-- ALBUMS -->

    <section class="albums">

      <div class="section-title">Albums</div>

      <div class="album-list">

        <a class="album" href="ep-vibe.html">
          <span class="album-name">EP VIBE</span>
          <span class="arrow">→</span>
        </a>

        <a class="album" href="after-the-vibe.html">
          <span class="album-name">AFTER THE VIBE</span>
          <span class="arrow">→</span>
        </a>

        <a class="album" href="beyond-the-vibe.html">
          <span class="album-name">BEYOND THE VIBE</span>
          <span class="arrow">→</span>
        </a>

        <a class="album" href="the-next-vibe.html">
          <span class="album-name">THE NEXT VIBE</span>
          <span class="arrow">→</span>
        </a>

      </div>

    </section>


    <!-- SOCIAL MEDIA -->

    <section class="connect">

      <div class="section-title">Connect</div>

      <div class="socials">

        <a href="https://youtube.com/@iltvibe?si=Ytfq8VnivkixFAzM" target="_blank">
          YouTube
        </a>

        <a href="https://music.youtube.com/@iltvibe" target="_blank">
          YouTube Music
        </a>

        <a href="#" target="_blank">
          Facebook
        </a>

        <a href="#" target="_blank">
          Instagram
        </a>

        <a href="#" target="_blank">
          TikTok
        </a>

      </div>

    </section>

  </main>


  <footer>
    ILTVIBE · I LIKE THE VIBE
  </footer>


  <script>

    /*
      ILTVIBE RANDOM YOUTUBE VIDEOS
    */

    const videos = [
      "jzF-l5wMv-I",
      "t9k3DmYtcZ8",
      "5WdlZZcAnxM",
      "aqJ6blP4fXc"
    ];


    function randomVideo() {
      const randomIndex = Math.floor(Math.random() * videos.length);
      const videoID = videos[randomIndex];
      document.getElementById("youtubePlayer").src =
        "https://youtube.comembed/" + videoID + "?autoplay=1";
    }

    // Awtomatikong magpapatugtog pagkabukas ng homepage
    randomVideo();

  </script>

</body>
  </html>
