<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ILTVIBE — I LIKE THE VIBE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER / BANNER */

    header {
      padding: 30px 0 15px;
      text-align: center;
    }

    .banner-box {
      width: min(900px, 92%);
      margin: auto;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid #222;
    }

    .banner-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* MAIN */

    main {
      width: min(900px, 92%);
      margin: auto;
    }

    .section-title {
      font-size: 12px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    /* RANDOM VIDEO */

    .random-section {
      margin-bottom: 55px;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid #222;
    }

    .video-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* SONG INFO */

    .song-info {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      padding: 12px 4px;
    }

    .song-artist-image {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #292929;
      box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    }

    .song-details {
      text-align: left;
      min-width: 0;
    }

    .song-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      margin-top: 5px;
      color: #777;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .random-button {
      display: block;
      margin: 12px auto 0;
      padding: 13px 25px;
      border: 1px solid #333;
      border-radius: 30px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 13px;
      letter-spacing: 1px;
      transition: 0.25s;
    }

    .random-button:hover {
      background: white;
      color: black;
      border-color: white;
    }

    /* ARTIST PROFILE SECTION */

    .artist-section {
      margin-bottom: 55px;
      text-align: center;
    }

    .artist-box {
      width: 100%;
      max-width: 450px;
      margin: auto;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid #222;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    .artist-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .artist-title {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
      letter-spacing: 2px;
    }

    /* ALBUMS */

    .albums {
      margin-bottom: 70px;
    }

    .album-list {
      display: grid;
      gap: 10px;
    }

    .album {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 24px;
      background: #0e0e0e;
      border: 1px solid #1d1d1d;
      border-radius: 12px;
      transition: 0.25s;
    }

    .album:hover {
      background: #151515;
      transform: translateX(5px);
      border-color: #444;
    }

    .album-name {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .arrow {
      color: #777;
      font-size: 20px;
    }

    /* CONNECT */

    .connect {
      text-align: center;
      padding: 35px 0 50px;
      border-top: 1px solid #181818;
    }

    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .socials a {
      padding: 10px 16px;
      border: 1px solid #242424;
      border-radius: 30px;
      color: #aaa;
      font-size: 13px;
      transition: 0.25s;
    }

    .socials a:hover {
      color: white;
      border-color: #555;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 0 20px 30px;
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        padding-top: 20px;
      }

      .album {
        padding: 19px;
      }

      .album-name {
        font-size: 15px;
      }

      .song-title {
        font-size: 15px;
      }

      .song-artist-image {
        width: 48px;
        height: 48px;
        min-width: 48px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGO BANNER HEADER -->

  <header>
    <div class="banner-box">
      <img src="banner.png" alt="ILTVIBE Official Banner">
    </div>
  </header>


  <main>

    <!-- RANDOM YOUTUBE VIDEO -->

    <section class="random-section">

      <div class="section-title">Random Vibe</div>

      <div class="video-box">

        <iframe
          id="youtubePlayer"
          src=""
          title="ILTVIBE Random Vibe"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>

      </div>


      <!-- ARTIST + SONG INFO -->

      <div class="song-info">

        <img
          id="songArtistImage"
          class="song-artist-image"
          src="artist.png"
          alt="ILTVIBE Artist">

        <div class="song-details">

          <div id="songTitle" class="song-title">
            Loading...
          </div>

          <div id="songArtist" class="song-artist">
            ILTVIBE
          </div>

        </div>

      </div>


      <button class="random-button" onclick="randomVideo()">
        ⟳ RANDOM VIBE
      </button>

    </section>



    <!-- ARTIST PROFILE IMAGE -->

    <section class="artist-section">

      <div class="section-title">The Artist</div>

      <div class="artist-box">

        <img
          src="artist.png"
          alt="ILTVIBE Artist Profile">

      </div>

      <div class="artist-title">
        ILTVIBE MUSIC
      </div>

    </section>



    <!-- ALBUMS -->

    <section class="albums">

      <div class="section-title">Albums</div>

      <div class="album-list">

        <a class="album" href="ep-vibe.html">

          <span class="album-name">
            EP VIBE
          </span>

          <span class="arrow">
            →
          </span>

        </a>


        <a class="album" href="after-the-vibe.html">

          <span class="album-name">
            AFTER THE VIBE
          </span>

          <span class="arrow">
            →
          </span>

        </a>


        <a class="album" href="beyond-the-vibe.html">

          <span class="album-name">
            BEYOND THE VIBE
          </span>

          <span class="arrow">
            →
          </span>

        </a>


        <a class="album" href="the-next-vibe.html">

          <span class="album-name">
            THE NEXT VIBE
          </span>

          <span class="arrow">
            →
          </span>

        </a>

      </div>

    </section>



    <!-- SOCIAL MEDIA -->

    <section class="connect">

      <div class="section-title">
        Connect
      </div>

      <div class="socials">

        <a
          href="https://www.youtube.com/"
          target="_blank">
          YouTube
        </a>

        <a
          href="https://music.youtube.com/"
          target="_blank">
          YouTube Music
        </a>

        <a
          href="#"
          target="_blank">
          Facebook
        </a>

        <a
          href="#"
          target="_blank">
          Instagram
        </a>

        <a
          href="#"
          target="_blank">
          TikTok
        </a>

      </div>

    </section>

  </main>



  <footer>

    ILTVIBE · I LIKE THE VIBE

  </footer>



  <script>

    /*
      ILTVIBE RANDOM YOUTUBE VIDEOS

      Each random video now has:
      - YouTube video
      - Song title
      - Artist name
      - Artist image
    */

    const videos = [

      {
        id: "jzF-l5wMv-I",
        title: "Sarap sa Piling",
        artist: "ILTVIBE",
        image: "artist.png"
      },

      {
        id: "t9k3DmYtcZ8",
        title: "Sinta",
        artist: "ILTVIBE",
        image: "artist.png"
      },

      {
        id: "5WdlZZcAnxM",
        title: "IG OFFICIAL",
        artist: "ILTVIBE",
        image: "artist.png"
      },

      {
        id: "aqJ6blP4fXc",
        title: "8-3-1-6-15-18-5-22-5-18",
        artist: "ILTVIBE",
        image: "artist.png"
      }

    ];


    function randomVideo() {

      const randomIndex =
        Math.floor(Math.random() * videos.length);

      const video = videos[randomIndex];


      /*
        CHANGE VIDEO
      */

      document.getElementById("youtubePlayer").src =
        "https://www.youtube.com/embed/" +
        video.id +
        "?autoplay=1";


      /*
        CHANGE SONG TITLE
      */

      document.getElementById("songTitle").textContent =
        video.title;


      /*
        CHANGE ARTIST NAME
      */

      document.getElementById("songArtist").textContent =
        video.artist;


      /*
        CHANGE ARTIST IMAGE
      */

      document.getElementById("songArtistImage").src =
        video.image;

    }


    /*
      RANDOM VIDEO WHEN HOMEPAGE OPENS
    */

    randomVideo();

  </script>

</body>
</html>
