<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ILTVIBE — I LIKE THE VIBE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      text-align: center;
      padding: 55px 20px 35px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .tagline {
      margin-top: 8px;
      color: #777;
      font-size: 12px;
      letter-spacing: 3px;
    }

    main {
      width: min(900px, 92%);
      margin: auto;
    }

    /* RANDOM VIBE */

    .section-title {
      font-size: 12px;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .player {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1d1d1d;
    }

    .player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .random-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #222;
      border-radius: 10px;
      background: #111;
      color: #aaa;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .random-btn:hover {
      background: #151515;
      color: #fff;
    }

    /* ARTIST */

    .artist {
      text-align: center;
      margin-top: 65px;
    }

    .artist img {
      width: 320px;
      max-width: 85%;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid #222;
      background: #0d0d0d;
    }

    .artist-name {
      margin-top: 18px;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .artist-subtitle {
      margin-top: 6px;
      color: #777;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .artist-meta {
      margin-top: 18px;
      color: #777;
      font-size: 11px;
      line-height: 1.8;
      letter-spacing: 0.4px;
    }

    /* ALBUMS */

    .albums {
      margin-top: 60px;
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .album-card {
      display: block;
      padding: 22px 18px;
      background: #101010;
      border: 1px solid #1d1d1d;
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      transition: 0.2s ease;
    }

    .album-card:hover {
      background: #151515;
      transform: translateY(-2px);
    }

    .album-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .album-subtitle {
      margin-top: 7px;
      color: #666;
      font-size: 10px;
      letter-spacing: 1px;
    }

    /* CONNECT */

    .connect {
      margin-top: 65px;
      text-align: center;
    }

    .socials {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }

    .socials a {
      padding: 11px 15px;
      border: 1px solid #222;
      border-radius: 9px;
      color: #999;
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .socials a:hover {
      color: #fff;
      background: #111;
    }

    footer {
      text-align: center;
      padding: 70px 20px 35px;
      color: #444;
      font-size: 10px;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {
      header {
        padding-top: 45px;
      }

      .logo {
        font-size: 34px;
      }

      .album-grid {
        grid-template-columns: 1fr;
      }

      .artist img {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">ILTVIBE</div>
    <div class="tagline">I LIKE THE VIBE</div>
  </header>

  <main>

    <!-- RANDOM VIBE -->
    <section>
      <div class="section-title">Random Vibe</div>

      <div class="player">
        <iframe
          id="youtubePlayer"
          src="https://www.youtube.com/embed/jzF-l5wMv-I?autoplay=1"
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      </div>

      <button class="random-btn" onclick="randomVideo()">
        ⟳ RANDOM VIBE
      </button>
    </section>


    <!-- ARTIST -->
    <section class="artist">

      <img src="artist.png" alt="ILTVIBE">

      <div class="artist-name">ILTVIBE</div>

      <div class="artist-subtitle">
        I LIKE THE VIBE
      </div>

      <div class="artist-meta">
        Genre: OPM Alternative Pop Rock / Cyber-Anito Neo-Folk
      </div>

    </section>


    <!-- ALBUMS -->
    <section class="albums">

      <div class="section-title">Albums</div>

      <div class="album-grid">

        <a class="album-card" href="ep-vibe.html">
          <div class="album-title">EP VIBE</div>
          <div class="album-subtitle">8 TRACKS</div>
        </a>

        <a class="album-card" href="after-the-vibe.html">
          <div class="album-title">AFTER THE VIBE</div>
          <div class="album-subtitle">10 TRACKS</div>
        </a>

        <a class="album-card" href="beyond-the-vibe.html">
          <div class="album-title">BEYOND THE VIBE</div>
          <div class="album-subtitle">12 TRACKS</div>
        </a>

        <a class="album-card" href="the-next-vibe.html">
          <div class="album-title">THE NEXT VIBE</div>
          <div class="album-subtitle">12 TRACKS</div>
        </a>

      </div>

    </section>


    <!-- CONNECT -->
    <section class="connect">

      <div class="section-title">Connect</div>

      <div class="socials">

        <a href="https://youtube.com/@iltvibe?si=SfmvGsvLqE5T-vko"
           target="_blank">
          YouTube
        </a>

        <a href="https://music.youtube.com/@iltvibe"
           target="_blank">
          YouTube Music
        </a>

        <a href="#"
           target="_blank">
          Facebook
        </a>

        <a href="#"
           target="_blank">
          Instagram
        </a>

        <a href="https://tiktok.com/@iltvibe"
           target="_blank">
          TikTok
        </a>

      </div>

    </section>

  </main>


  <footer>
    ILTVIBE · I LIKE THE VIBE
  </footer>


  <script>

    const videos = [
      "jzF-l5wMv-I",
      "t9k3DmYtcZ8",
      "5WdlZZcAnxM",
      "aqJ6blP4fXc",
      "HgDhB13B4Q4",
      "M-WCmXS8E3c"
    ];

    function randomVideo() {

      const randomIndex =
        Math.floor(Math.random() * videos.length);

      const videoId = videos[randomIndex];

      document.getElementById("youtubePlayer").src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1";
    }

  </script>

</body>
</html>
