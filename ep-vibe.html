
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EP VIBE - ILTVIBE</title>
<meta name="theme-color" content="#000000">

<style>
* {
    box-sizing: border-box;
}

:root {
    --accent: #A78BFA;
    --accent-rgb: 167, 139, 250;
    --accent-soft: rgba(167, 139, 250, 0.12);
    --accent-border: rgba(167, 139, 250, 0.35);
    --accent-glow: rgba(167, 139, 250, 0.28);
    --accent-backlight: rgba(167, 139, 250, 0.13);
}

html {
    background: #000;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    position: relative;
    isolation: isolate;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at 50% 0%,
            var(--accent-backlight),
            transparent 55%
        ),
        radial-gradient(
            ellipse at 0% 50%,
            rgba(var(--accent-rgb), 0.07),
            transparent 45%
        ),
        radial-gradient(
            ellipse at 100% 80%,
            rgba(var(--accent-rgb), 0.06),
            transparent 45%
        );
}

.container {
    width: 90%;
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 0 80px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 5px;
    margin-bottom: 8px;
    text-shadow: 0 0 18px var(--accent-glow);
}

.tagline {
    font-size: 12px;
    letter-spacing: 3px;
    color: #999;
}

.banner {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    border-radius: 5px;
    margin-bottom: 30px;
    border: 1px solid var(--accent-border);
    box-shadow:
        0 0 18px var(--accent-glow),
        0 0 45px rgba(var(--accent-rgb), 0.08);
}

.album-title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 8px;
    text-shadow: 0 0 14px var(--accent-glow);
}

.album-info {
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-bottom: 30px;
}

.track {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 17px 12px;
    border-bottom: 1px solid rgba(var(--accent-rgb), 0.16);
    transition: 0.25s ease;
}

.track:hover {
    background: var(--accent-soft);
    border-bottom-color: var(--accent-border);
    box-shadow: 0 0 18px rgba(var(--accent-rgb), 0.06);
}

.track-name {
    font-size: 15px;
    line-height: 1.4;
    transition: 0.2s ease;
}

.track:hover .track-name {
    color: var(--accent);
}

.listen-btn {
    flex-shrink: 0;
    display: inline-block;
    padding: 9px 16px;
    border: 1px solid var(--accent-border);
    border-radius: 3px;
    color: #fff;
    background: transparent;
    text-decoration: none;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.2s ease;
}

.listen-btn:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
}

.back {
    display: inline-block;
    margin-top: 35px;
    color: #999;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 2px;
    transition: 0.2s ease;
}

.back:hover {
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent-glow);
}

footer {
    text-align: center;
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid rgba(var(--accent-rgb), 0.14);
    color: #666;
    font-size: 10px;
    letter-spacing: 2px;
}

@media (max-width: 600px) {
    .container {
        width: 88%;
        padding-top: 30px;
        padding-bottom: 80px;
    }

    .logo {
        font-size: 27px;
        letter-spacing: 4px;
    }

    .album-title {
        font-size: 24px;
    }

    .track {
        padding: 15px 8px;
    }

    .track-name {
        font-size: 14px;
    }

    .listen-btn {
        padding: 8px 12px;
        font-size: 9px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition: none !important;
    }
}
</style>
</head>

<script>
/* RANDOM RGB THEME */

const themes = [
    { name: "Electric Purple", color: "#A78BFA", rgb: "167, 139, 250" },
    { name: "Neon Blue", color: "#60A5FA", rgb: "96, 165, 250" },
    { name: "Cyber Cyan", color: "#22D3EE", rgb: "34, 211, 238" },
    { name: "Neon Pink", color: "#F472B6", rgb: "244, 114, 182" },
    { name: "Champagne Gold", color: "#FBBF24", rgb: "251, 191, 36" },
    { name: "Emerald Green", color: "#34D399", rgb: "52, 211, 153" },
    { name: "Deep Crimson", color: "#FB7185", rgb: "251, 113, 133" },
    { name: "Violet", color: "#C084FC", rgb: "192, 132, 252" }
];

let previousTheme = null;

try {
    previousTheme = localStorage.getItem("iltvibeTheme");
} catch (error) {
    previousTheme = null;
}

let availableThemes = themes.filter(
    theme => theme.name !== previousTheme
);

if (availableThemes.length === 0) {
    availableThemes = themes;
}

const selectedTheme =
    availableThemes[Math.floor(Math.random() * availableThemes.length)];

const root = document.documentElement;

root.style.setProperty("--accent", selectedTheme.color);
root.style.setProperty("--accent-rgb", selectedTheme.rgb);
root.style.setProperty("--accent-soft", `rgba(${selectedTheme.rgb}, 0.12)`);
root.style.setProperty("--accent-border", `rgba(${selectedTheme.rgb}, 0.35)`);
root.style.setProperty("--accent-glow", `rgba(${selectedTheme.rgb}, 0.28)`);
root.style.setProperty("--accent-backlight", `rgba(${selectedTheme.rgb}, 0.13)`);

try {
    localStorage.setItem("iltvibeTheme", selectedTheme.name);
} catch (error) {
    // The page still works if browser storage is unavailable.
}
</script>
