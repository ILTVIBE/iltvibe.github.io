<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EP VIBE — ILTVIBE</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #080808;
        color: #ffffff;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        width: 90%;
        max-width: 720px;
        margin: 0 auto;
        padding: 40px 0 60px;
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .logo {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 5px;
        margin-bottom: 8px;
    }

    .tagline {
        font-size: 12px;
        letter-spacing: 3px;
        color: #888;
    }

    .banner {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        border-radius: 4px;
        margin-bottom: 30px;
    }

    .album-title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }

    .album-info {
        font-size: 12px;
        color: #777;
        letter-spacing: 2px;
        margin-bottom: 30px;
    }

    .track {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 17px 0;
        border-bottom: 1px solid #1d1d1d;
    }

    .track-name {
        font-size: 15px;
        line-height: 1.4;
    }

    .listen-btn {
        flex-shrink: 0;
        display: inline-block;
        padding: 9px 16px;
        border: 1px solid #444;
        border-radius: 3px;
        color: #fff;
        text-decoration: none;
        font-size: 10px;
        letter-spacing: 2px;
        transition: 0.2s ease;
    }

    .listen-btn:hover {
        background: #fff;
        color: #000;
        border-color: #fff;
    }

    .back {
        display: inline-block;
        margin-top: 35px;
        color: #777;
        text-decoration: none;
        font-size: 11px;
        letter-spacing: 2px;
        transition: 0.2s ease;
    }

    .back:hover {
        color: #fff;
    }

    footer {
        text-align: center;
        margin-top: 50px;
        color: #444;
        font-size: 10px;
        letter-spacing: 2px;
    }

    @media (max-width: 600px) {
        .container {
            width: 88%;
            padding-top: 30px;
        }

        .logo {
            font-size: 27px;
            letter-spacing: 4px;
        }

        .album-title {
            font-size: 24px;
        }

        .track {
            padding: 15px 0;
        }

        .track-name {
            font-size: 14px;
        }

        .listen-btn {
            padding: 8px 12px;
            font-size: 9px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">ILTVIBE</div>
        <div class="tagline">I LIKE THE VIBE</div>

    <div class="track">

            LISTEN
        </a>
    </div>

    <div class="track">

    </div>

    <a href="index.html" class="back">← BACK TO ILTVIBE</a>

    <footer>
        © 2026 ILTVIBE · I LIKE THE VIBE
    </footer>

</div>

</body>
</html>
