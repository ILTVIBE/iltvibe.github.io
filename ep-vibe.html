<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EP VIBE — ILTVIBE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: auto;
      padding: 45px 20px 60px;
    }

    /* LOGO */

    .logo {
      text-align: center;
      font-size: 40px;
      font-weight: 800;
      letter-spacing: 5px;
      margin-bottom: 6px;
    }

    .tagline {
      text-align: center;
      color: #888;
      font-size: 12px;
      letter-spacing: 3px;
      margin-bottom: 40px;
    }

    /* ALBUM COVER */

    .album-cover {
      width: 100%;
      max-width: 700px;
      margin: 0 auto 30px;
    }

    .album-cover img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }

    /* ALBUM INFO */

    .album-title {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      margin: 0;
    }

    .album-info {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 8px;
      margin-bottom: 30px;
      letter-spacing: 1px;
    }

    /* YOUTUBE PLAYER */

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 30px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }

    .player iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* CURRENT SONG */

    .now-playing {
      text-align: center;
      color: #777;
      font-size: 12px;
      letter-spacing: 1px;
      margin-top: -15px;
      margin-bottom: 25px;
    }

    .now-playing span {
      color: #ffffff;
      font-weight: 700;
    }

    /* TRACKLIST */

    .track {
      display: flex;
      align-items: center;
      gap: 14px;

      background: #141414;
      border: 1px solid #242424;

      border-radius: 14px;

      padding: 16px 17px;
      margin-bottom: 10px;

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .track:hover {
      background: #1c1c1c;
      border-color: #383838;
      transform: translateY(-2px);
    }

    .track-number {
      width: 30px;
      color: #666;
      font-size: 13px;
      text-align: center;
      flex-shrink: 0;
    }

    .track-title {
      flex: 1;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
    }

    .listen {
      flex-shrink: 0;

      color: #ffffff;
      background: transparent;

      border: 1px solid #444;
      border-radius: 20px;

      padding: 7px 14px;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .listen:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* ACTIVE TRACK */

    .track.active {
      background: #1c1c1c;
      border-color: #555;
    }

    .track.active .track-number {
      color: #ffffff;
    }

    /* BACK BUTTON */

    .back {
      display: block;
      width: fit-content;

      margin: 38px auto 0;

      color: #777;
      text-decoration: none;

      font-size: 13px;
      letter-spacing: 1px;

      transition: 0.2s ease;
    }

    .back:hover {
      color: #ffffff;
    }

    /* FOOTER */

    footer {
      text-align: center;

      margin-top: 55px;

      color: #444;

      font-size: 11px;
      letter-spacing: 2px;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      .container {
        padding: 35px 15px 50px;
      }

      .logo {
        font-size: 32px;
      }

      .album-title {
        font-size: 27px;
      }

      .track {
        padding: 14px 12px;
        gap: 9px;
      }

      .track-title {
        font-size: 14px;
      }

      .listen {
        padding: 6px 10px;
        font-size: 10px;
      }

    }
  </style>
</head>

<body>

    <!-- ALBUM COVER -->

    <!-- NOW PLAYING -->

    <!-- TRACK 03 -->

    <div class="track">

      </div>

      <button

    <!-- TRACK 05 -->

    <div class="track">

      <div class="track-number">
        05
      </div>

      <div class="track-title">
        1004
      </div>

      <button
        class="listen"
        onclick="playSong('jzF-l5wMv-I', '1004', this)"
      >
        PLAY
      </button>

    </div>


    <!-- TRACK 06 -->

    <div class="track">

      <div class="track-number">
        06
      </div>

      <div class="track-title">
        ELAINE
      </div>

      <button

        onclick="playSong('', 'ELAINE', this)"

    <!-- TRACK 07 -->

    <div class="track">

    <!-- TRACK 08 -->

      </button>

    </div>


    <!-- BACK TO HOME -->

    <a
      class="back"
      href="index.html"
    >
      ← BACK TO ILTVIBE
    </a>


    <!-- FOOTER -->

    <footer>
      ILTVIBE · I LIKE THE VIBE
    </footer>

  </div>


  <script>

    function playSong(videoId, title, button) {

      if (!videoId) {
        alert("YouTube link coming soon.");
        return;
      }

      const player = document.getElementById("youtubePlayer");

      const nowPlaying = document.getElementById("nowPlaying");

      player.src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1";

      nowPlaying.textContent = title;


      const tracks =
        document.querySelectorAll(".track");

      tracks.forEach(function(track) {
        track.classList.remove("active");
      });


      button
        .closest(".track")
        .classList.add("active");


      window.scrollTo({
        top: player.getBoundingClientRect().top +
             window.scrollY -
             20,
        behavior: "smooth"
      });

    }

  </script>

</body>
  </html>
