<style>
* {
    box-sizing: border-box;
}

:root {
    --accent: #A78BFA;
    --accent-rgb: 167,139,250;
    --accent-soft: rgba(167,139,250,0.12);
    --accent-border: rgba(167,139,250,0.35);
    --accent-glow: rgba(167,139,250,0.28);
}

html {
    background: #000000;
}

body {
    margin: 0;
    background: #000000;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    position: relative;
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
        radial-gradient(ellipse at 50% 0%, var(--accent-glow), transparent 48%),
        radial-gradient(ellipse at 0% 55%, rgba(var(--accent-rgb),0.08), transparent 42%),
        radial-gradient(ellipse at 100% 85%, rgba(var(--accent-rgb),0.07), transparent 40%);
}

.container {
    position: relative;
    z-index: 1;
    max-width: 720px;
    margin: auto;
    padding: 45px 20px 60px;
}

/* LOGO */

.logo {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    letter-spacing: 5px;
    margin-bottom: 5px;
    text-shadow: 0 0 18px var(--accent-glow);
}

.tagline {
    text-align: center;
    color: #888;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 35px;
}

/* ALBUM BANNER */

.album-cover {
    width: 100%;
    max-width: 700px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    margin: 0 auto 28px;
    border-radius: 16px;
    border: 1px solid var(--accent-border);
    box-shadow:
        0 15px 45px rgba(0,0,0,0.65),
        0 0 25px var(--accent-glow);
}

/* ALBUM INFO */

.album-title {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
    text-shadow: 0 0 16px var(--accent-glow);
}

.album-info {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 35px;
}

/* TRACKS */

.track {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;

    background: #0c0c0c;
    border: 1px solid #252525;
    border-radius: 14px;

    padding: 16px 18px;
    margin-bottom: 12px;

    transition: 0.25s ease;
}

.track:hover {
    transform: translateY(-2px);
    border-color: var(--accent-border);
    background: var(--accent-soft);
    box-shadow: 0 0 18px var(--accent-glow);
}

.track-left {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 0;
}

.track-number {
    color: var(--accent);
    font-size: 13px;
    min-width: 22px;
}

.track-title {
    font-size: 15px;
    font-weight: 500;
    color: #777;
}

/* LISTEN BUTTON */

.listen {
    flex-shrink: 0;

    text-decoration: none;
    color: #ffffff;

    border: 1px solid var(--accent-border);
    border-radius: 8px;

    padding: 8px 14px;

    font-size: 11px;
    letter-spacing: 1px;

    transition: 0.2s ease;
}

.listen:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #000000;
    box-shadow: 0 0 15px var(--accent-glow);
}

/* BACK */

.back {
    display: block;
    width: fit-content;

    margin: 35px auto 0;

    color: #888;
    text-decoration: none;

    font-size: 12px;
    letter-spacing: 1px;

    transition: 0.2s ease;
}

.back:hover {
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent-glow);
}

/* FOOTER */

footer {
    text-align: center;
    color: #555;
    font-size: 11px;
    margin-top: 45px;
    letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 500px) {
    .container {
        padding: 35px 16px 50px;
    }

    .logo {
        font-size: 32px;
        letter-spacing: 4px;
    }

    .tagline {
        margin-bottom: 28px;
    }

    .album-cover {
        border-radius: 12px;
        margin-bottom: 24px;
    }

    .album-title {
        font-size: 27px;
    }

    .track {
        padding: 14px;
    }

    .track-title {
        font-size: 14px;
    }

    .listen {
        padding: 7px 11px;
        font-size: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        transition: none !important;
    }
}
</style>

<script>
const themes = [
    { name: "Electric Purple", accent: "#A78BFA", rgb: "167,139,250" },
    { name: "Neon Blue", accent: "#60A5FA", rgb: "96,165,250" },
    { name: "Cyber Cyan", accent: "#22D3EE", rgb: "34,211,238" },
    { name: "Neon Pink", accent: "#F472B6", rgb: "244,114,182" },
    { name: "Champagne Gold", accent: "#FBBF24", rgb: "251,191,36" },
    { name: "Emerald Green", accent: "#34D399", rgb: "52,211,153" },
    { name: "Deep Crimson", accent: "#FB7185", rgb: "251,113,133" },
    { name: "Violet", accent: "#C084FC", rgb: "192,132,252" }
];

let previousTheme = null;

try {
    previousTheme = localStorage.getItem("iltvibeTheme");
} catch (error) {
    previousTheme = null;
}

let availableThemes = themes.filter(theme => theme.name !== previousTheme);

if (availableThemes.length === 0) {
    availableThemes = themes;
}

const selectedTheme =
    availableThemes[Math.floor(Math.random() * availableThemes.length)];

document.documentElement.style.setProperty(
    "--accent",
    selectedTheme.accent
);

document.documentElement.style.setProperty(
    "--accent-rgb",
    selectedTheme.rgb
);

document.documentElement.style.setProperty(
    "--accent-soft",
    `rgba(${selectedTheme.rgb},0.12)`
);

document.documentElement.style.setProperty(
    "--accent-border",
    `rgba(${selectedTheme.rgb},0.35)`
);

document.documentElement.style.setProperty(
    "--accent-glow",
    `rgba(${selectedTheme.rgb},0.28)`
);

try {
    localStorage.setItem("iltvibeTheme", selectedTheme.name);
} catch (error) {
    // Page still works if localStorage is unavailable.
}
</script>
